[package]
name = "hotpipe-gui"
version = "0.1.0"
edition = "2021"
description = "Окно управления SSH-туннелями HotPipe"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
# Как и в wsldrive, зависимостей намеренно мало: сеть ненадёжна, а каждая
# лишняя — это ещё десяток пакетов при сборке. HTTP к петлевому адресу и
# реестр (через reg.exe) обходятся без готовых библиотек.
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
